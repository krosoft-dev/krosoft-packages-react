name: Storybook

# Sur `main`, le Storybook est construit et déployé par le workflow Publish, une fois
# la version npm publiée — ici on ne fait que valider les PR.
on:
  pull_request:
    branches: [main]

jobs:
  storybook:
    uses: krosoft-dev/Krosoft.DevOps.GitHub/.github/workflows/npm-build.yml@main
    with:
      build-script: storybook:build
      run-tests: false
